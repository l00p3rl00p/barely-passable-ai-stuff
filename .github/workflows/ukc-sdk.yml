name: UKC SDK native-ingester
on:
  pull_request:
    paths:
      - 'knowledge-positions/sdk/**'
      - '.github/workflows/ukc-sdk.yml'
  push:
    paths:
      - 'knowledge-positions/sdk/**'
      - '.github/workflows/ukc-sdk.yml'
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: knowledge-positions/sdk
      - name: SDK source fidelity tests
        run: cargo test --manifest-path knowledge-positions/sdk/Cargo.toml --all-targets
