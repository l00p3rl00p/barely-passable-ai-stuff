name: Paper reconstruction proof

on:
  push:
    branches: [docs/knowledge-positions-sdf-navigation]
  pull_request:
    paths:
      - 'knowledge-positions/SDF/examples/**'
      - 'knowledge-positions/research/**'
      - 'knowledge-positions/tests/test_paper_reconstruction.py'
      - '.github/workflows/paper-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy
      - run: python knowledge-positions/tests/test_paper_reconstruction.py
