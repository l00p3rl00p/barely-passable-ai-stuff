<title id="title">Just-in-Time Knowledge: one conversation, three positions, living context</title><desc id="desc">Original conversation remains separate. A source-addressed knowledge record connects location, relation and proximity. The intelligence retrieves a bounded neighborhood, works and saves qualified discoveries. Source changes invalidate dependents.</desc>
