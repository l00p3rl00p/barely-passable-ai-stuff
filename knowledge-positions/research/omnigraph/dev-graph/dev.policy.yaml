# Coordination graph policy (schema and queries: ModernRelay omnigraph-cookbooks dev-graph
# @ c13bac1, MIT, unchanged). Roles follow the reference installation; main is protected.
# Agents keep distinct identities, so every commit names the agent that made it. Routine
# coordination (registering, assignment status, messages) is written on main without human
# review; agents may also open unprotected branches for proposals that an admin reviews.
# act-kp-agent is the identity of MCP clients (Claude Code, Codex, Antigravity): it coordinates
# here as an agent, as `act-agent-alpha` and `-beta` do, so an MCP client can register, read
# assignments and post messages without an administrator. It still cannot change the schema.
version: 1
groups:
  readers: [act-admin, act-kp-human, act-kp-agent, act-agent-alpha, act-agent-beta]
  writers: [act-admin]
  admins: [act-admin]
  agents: [act-kp-agent, act-agent-alpha, act-agent-beta]
protected_branches: [main]
rules:
  - id: read-data
    allow:
      actors: { group: readers }
      actions: [read, export]
      branch_scope: any
  - id: invoke-stored-queries
    allow:
      actors: { group: readers }
      actions: [invoke_query]
  - id: write-data
    allow:
      actors: { group: writers }
      actions: [change]
      branch_scope: any
  - id: manage-branches
    allow:
      actors: { group: writers }
      actions: [branch_create, branch_delete, branch_merge]
      target_branch_scope: any
  - id: agents-coordinate
    allow:
      actors: { group: agents }
      actions: [change]
      branch_scope: any
  - id: agents-open-branches
    allow:
      actors: { group: agents }
      actions: [branch_create]
      target_branch_scope: unprotected
  - id: change-schema
    allow:
      actors: { group: admins }
      actions: [schema_apply]
