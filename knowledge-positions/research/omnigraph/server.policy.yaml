# Cluster-scope policy. Two different responsibilities, kept in two rules (OmniGraph requires
# server-scoped actions to be granted in rules of their own, with no branch scope):
#
# - graph_list (`GET /graphs`, the MCP `graphs` tool for a static-token actor): discovery.
#   Every identity that holds a role on a graph in this installation may list the served
#   graphs, so an agent or a person can find what to open without an administrator.
#   It grants no access to any graph: reading, writing and invoking stored queries stay
#   governed by each graph's own policy. Static-token actors cannot use the identity-only
#   `GET /graphs/discovery` route, so this is the native way to give them discovery.
#   Exposure, verified on a scratch server (see IMPLEMENTATION.md, Authorization review):
#   the catalog is not filtered per caller. It lists every served graph, including graphs
#   the caller may not read, and the raw HTTP route also returns each graph's storage
#   `uri`; OmniGraph's MCP `graphs` tool narrows that to id and display name.
#
# - config_manage (`cluster plan/apply --target <admin target>`): administration of the
#   running configuration. Admins only. Ordinary participation never needs it.
version: 1
groups:
  admins: [act-admin]
  # Every actor named by a graph policy in this cluster. Add an actor here when it is
  # admitted to a graph; remove it when its last graph role is removed.
  participants:
    - act-admin
    - act-kp-human
    - act-kp-agent
    - act-kp-maintenance
    - act-agent-alpha
    - act-agent-beta
rules:
  - id: discover-graphs
    allow:
      actors: { group: participants }
      actions: [graph_list]
  - id: manage-configuration
    allow:
      actors: { group: admins }
      actions: [config_manage]
