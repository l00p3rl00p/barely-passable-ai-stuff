[package]
name = "ukc-ingest"
version = "0.1.0"
edition = "2021"
description = "Native UKC/1 ingestion and OmniGraph projection without LinkML"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
rayon = "1"
pulldown-cmark = "0.12"
csv = "1"
regex = "1"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"
