[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[project]
name = "knowledge-positions"
version = "0.1.0"
description = "Source-backed knowledge positions: location, relations, proximity, and verifiable evidence"
readme = "README.md"
keywords = ["knowledge", "source-navigation", "graph", "retrieval", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = ["networkx", "sentence-transformers", "numpy"]
[project.urls]
Repository = "https://github.com/l00p3rl00p/barely-passable-ai-stuff"
Documentation = "https://github.com/l00p3rl00p/barely-passable-ai-stuff/tree/main/knowledge-positions"

[tool.setuptools]
py-modules = ["knowledge_positions"]

[project.optional-dependencies]
paper-alpha = ["markdown-it-py", "PyYAML"]
